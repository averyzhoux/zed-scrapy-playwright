[project]
name = "zed-sp-translate"
version = "0.1.0dev1"
description = "The translator for zed-scrapy-playwright that translates the methods from scrapy-playwright."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "zhouzhouos", email = "leisure-zyf@qq.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
zed-sp-translate = "zed_sp_translate:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
