name: 🛠️ Bug Report
description: 报告一个可复现的 bug
title: "[Bug]: "
labels: ["bug", "triage"]
# assignees:
#   - zhouzhouos

body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整，方便快速定位问题。
        提交前请先搜索是否已有相同 issue。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issues，确认没有重复
          required: true
        - label: 我使用的是最新版本
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 清晰简洁地描述这个 bug 是什么
      placeholder: 出现了什么问题？
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 尽可能提供最小可复现示例（MRE）
      placeholder: |
        1. 安装 ...
        2. 运行 ...
        3. 看到报错 ...
      render: bash
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / 报错信息
      description: 粘贴完整 traceback 或日志（会自动格式化为代码块）
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: zed-scrapy-playwright 版本
      placeholder: 例如 0.3.1
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python 版本
      placeholder: 例如 3.12.14
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如 Ubuntu 24.04 / Windows 11 / macOS 15
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - pip install zed-scrapy-playwright
        - pip install zed-scrapy-playwright[schedule]
        - pip install zed-scrapy-playwright[translate]
        - pip install zed-scrapy-playwright[all]
        - 从源码安装
        - 其他
    validations:
      required: true