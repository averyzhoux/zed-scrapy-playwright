name: ✨ Feature Request
description: 提出一个新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请描述清楚需求场景，帮助判断是否值得实现。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issues，确认没有重复
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你的需求/痛点是什么？
      description: 这个功能要解决什么问题？当前是怎么绕过的？
      placeholder: 我在做 ... 的时候，遇到 ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望 API / 行为是什么样的？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
    validations:
      required: false

  - type: textarea
    id: example
    attributes:
      label: 使用示例（可选）
      description: 理想情况下的调用代码
      render: python
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 主包 (zed-scrapy-playwright)
        - 调度器 (zed-sp-schedule)
        - 翻译器 (zed-sp-translate)
        - 文档
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: 你是否愿意提交 PR？
      options:
        - label: 我愿意尝试自己实现
          required: false